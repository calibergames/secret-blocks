modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/calibergames/secret-blocks/issues"

[[mods]]
modId = "secretblocks"
version = "${version}"
displayName = "Secret Blocks"
displayURL = "https://github.com/calibergames/secret-blocks"
iconFile = "assets/secretblocks/icon.png"
authors = "CaliberMC"
description = '''Hidden blocks that look like the blocks around them.'''

[[mixins]]
config = "secretblocks.mixins.json"

[[mixins]]
config = "secretblocks.neoforge.mixins.json"

[[dependencies.secretblocks]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.secretblocks]]
modId = "minecraft"
type = "required"
versionRange = "[${neoforge_minecraft_min},${next_minecraft_version})"
ordering = "NONE"
side = "BOTH"
