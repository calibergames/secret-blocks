// The NeoForge jar for 1.20.1, built against NeoForge 1.20.1 (the 47.1 fork of
// Forge 47, same API), which also loads on Forge 1.20.1: common plus the
// NeoForge/Forge entry points, events and rendering.
plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev.legacyforge'
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

// Game tests: the shared tests (common/src/gametest) and this loader's test
// mod (secretblocks_gametest) in their own source set, never in the release jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	commonGametestJava {
		canBeResolved = true
	}
	commonGametestResources {
		canBeResolved = true
	}
	// Where reobfuscating the test jar publishes it (nothing consumes them).
	gametestApiElements {
		canBeConsumed = true
		canBeResolved = false
	}
	gametestRuntimeElements {
		canBeConsumed = true
		canBeResolved = false
	}
	gametestImplementation.extendsFrom implementation
	gametestCompileOnly.extendsFrom compileOnly
	gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	commonGametestJava project(path: ':common', configuration: 'commonGametestJava')
	commonGametestResources project(path: ':common', configuration: 'commonGametestResources')
	gametestCompileOnly project(':common')
}

tasks.named('compileGametestJava', JavaCompile) {
	dependsOn(configurations.commonGametestJava)
	source(configurations.commonGametestJava)
}

tasks.named('processGametestResources', ProcessResources) {
	dependsOn(configurations.commonGametestResources)
	from(configurations.commonGametestResources)
}

def rootBuild = rootProject.layout.buildDirectory.get().asFile.path

legacyForge {
	enable {
		neoForgeVersion = neoforge_version
		enabledSourceSets = [sourceSets.main, sourceSets.gametest]
	}
	parchment {
		minecraftVersion = minecraft_version
		mappingsVersion = parchment_mappings
	}
	runs {
		client {
			client()
			gameDirectory = rootProject.file('run-neoforge')
		}
		server {
			server()
			gameDirectory = rootProject.file('run-neoforge/server')
		}
		// A client with the development-only command-file driver (the shared game
		// test source set): scripts act as the player through the real client code.
		devClient {
			client()
			gameDirectory = rootProject.file('run-neoforge')
			sourceSet = sourceSets.gametest
			systemProperty 'secretblocks.driver', "${rootBuild}/devclient"
		}
		// A headless server that runs every shared game test and exits with the
		// number of failures; `check` (and so `build`) depends on it.
		gameTestServer {
			type = 'gameTestServer'
			gameDirectory = file("${rootBuild}/gametest-neoforge")
			sourceSet = sourceSets.gametest
			// The tests sit on the flat world's ground, as on Fabric (Forge's default is y 60).
			programArguments.addAll '--spawnPos', '0,0,0'
			systemProperty 'secretblocks.gametest.report', "${rootBuild}/gametest-neoforge/junit.xml"
		}
	}
	mods {
		secretblocks {
			sourceSet sourceSets.main
		}
		secretblocks_gametest {
			sourceSet sourceSets.gametest
		}
	}
}

// Each run starts from a fresh test world, a flat one as Fabric's (and vanilla's)
// test server makes: Forge's makes its world from server.properties, which
// would otherwise give normal terrain over the tests.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
	doFirst {
		delete "${rootBuild}/gametest-neoforge/world"
		def properties = file("${rootBuild}/gametest-neoforge/server.properties")
		properties.parentFile.mkdirs()
		// Vanilla's default flat world: bedrock, two dirt, grass, plains.
		properties.text = 'level-type=minecraft\\:flat\n' +
				'generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\n'
	}
}

tasks.named('check') {
	dependsOn 'runGameTestServer'
}

// Renderer checks: `-Prenderers` adds Embeddium and Oculus to the development
// runs (remapped to development names). Nothing else uses them.
if (project.hasProperty('renderers')) {
	dependencies {
		modRuntimeOnly "maven.modrinth:embeddium:${embeddium_version}"
		modRuntimeOnly "maven.modrinth:oculus:${oculus_version}"
	}
}

// Connected textures: `-Pfusion` adds Fusion to the development runs.
if (project.hasProperty('fusion')) {
	dependencies {
		modRuntimeOnly "maven.modrinth:fusion-connected-textures:${fusion_version}"
	}
}

mixin {
	add sourceSets.main, 'secretblocks.refmap.json'
	config 'secretblocks.mixins.json'
	config 'secretblocks.neoforge.mixins.json'
	config 'secretblocks_gametest.mixins.json'
	config 'secretblocks_gametest.driver.mixins.json'
}

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	gametestAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
	manifest.attributes([
		'MixinConfigs': 'secretblocks.mixins.json,secretblocks.neoforge.mixins.json'
	])
}

// The game tests as a jar for production Forge and NeoForge servers (SRG names,
// with the test mixins' refmap), to run them against released loader versions:
// start the server with -Dforge.enableGameTest=true -Dforge.gameTestServer=true.
// Never published; it is built outside build/libs.
def gametestRefmap = mixin.add(sourceSets.gametest, 'secretblocks_gametest.refmap.json')

def gametestDevJar = tasks.register('gametestDevJar', Jar) {
	from sourceSets.gametest.output
	from gametestRefmap
	archiveClassifier = 'gametest-dev'
	destinationDirectory = layout.buildDirectory.dir('devlibs')
	manifest.attributes([
		'MixinConfigs': 'secretblocks_gametest.mixins.json'
	])
}

def reobfGametest = obfuscation.reobfuscate(gametestDevJar, sourceSets.gametest) {
	archiveClassifier = 'gametest'
	destinationDirectory = layout.buildDirectory.dir('gametestlibs')
}

tasks.register('gametestJar') {
	dependsOn reobfGametest
}

// The release jar's reobfuscation reads every mixin source set's mappings.
tasks.named('reobfJar') {
	dependsOn 'compileGametestJava'
}

processGametestResources {
	// The test mixins on Forge 1.20.1 need their refmap (SRG names), as the mod's own.
	inputs.property 'refmap', 'secretblocks_gametest.refmap.json'
	filesMatching('secretblocks_gametest.mixins.json') {
		filter { line -> line.contains('"package"') ? line + '\n\t"refmap": "secretblocks_gametest.refmap.json",' : line }
	}
}

processResources {
	def props = [version: project.version, minecraft_version: minecraft_version, neoforge_version: neoforge_version]
	inputs.properties props
	filesMatching('META-INF/mods.toml') {
		expand props
	}
	// Forge 1.20.1 runs on SRG names: the shared mixin config points at the refmap
	// built here (the Fabric jar needs none, so common's own copy names none).
	filesMatching('secretblocks.mixins.json') {
		filter { line -> line.contains('"package"') ? line + '\n\t"refmap": "secretblocks.refmap.json",' : line }
	}
}
