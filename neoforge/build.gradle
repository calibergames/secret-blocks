// The NeoForge jar, built against NeoForge (its own API from 1.20.2; Mojang
// names at run time, so no reobfuscation and no mixin refmap): common plus the
// NeoForge entry points, events and rendering. Forge has its own jar (the
// forge subproject).
plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev'
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

// Game tests: the shared tests (common/src/gametest) and this loader's test
// mod (secretblocks_gametest) in their own source set, never in the release jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	commonGametestJava {
		canBeResolved = true
	}
	commonGametestResources {
		canBeResolved = true
	}
	gametestImplementation.extendsFrom implementation
	gametestCompileOnly.extendsFrom compileOnly
	gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	commonGametestJava project(path: ':common', configuration: 'commonGametestJava')
	commonGametestResources project(path: ':common', configuration: 'commonGametestResources')
	gametestCompileOnly project(':common')
}

tasks.named('compileGametestJava', JavaCompile) {
	dependsOn(configurations.commonGametestJava)
	source(configurations.commonGametestJava)
}

tasks.named('processGametestResources', ProcessResources) {
	dependsOn(configurations.commonGametestResources)
	from(configurations.commonGametestResources)
}

def rootBuild = rootProject.layout.buildDirectory.get().asFile.path

neoForge {
	enable {
		version = neoforge_version
		enabledSourceSets = [sourceSets.main, sourceSets.gametest]
	}
	parchment {
		minecraftVersion = parchment_minecraft
		mappingsVersion = parchment_mappings
	}
	runs {
		client {
			client()
			gameDirectory = rootProject.file('run-neoforge')
		}
		server {
			server()
			gameDirectory = rootProject.file('run-neoforge/server')
		}
		// A client with the development-only command-file driver (the shared game
		// test source set): scripts act as the player through the real client code.
		devClient {
			client()
			gameDirectory = rootProject.file('run-neoforge')
			sourceSet = sourceSets.gametest
			systemProperty 'secretblocks.driver', "${rootBuild}/devclient"
		}
		// A headless server that runs every shared game test and exits with the
		// number of failures; `check` (and so `build`) depends on it.
		gameTestServer {
			type = 'gameTestServer'
			gameDirectory = file("${rootBuild}/gametest-neoforge")
			sourceSet = sourceSets.gametest
			systemProperty 'secretblocks.gametest.report', "${rootBuild}/gametest-neoforge/junit.xml"
		}
	}
	mods {
		secretblocks {
			sourceSet sourceSets.main
		}
		secretblocks_gametest {
			sourceSet sourceSets.gametest
		}
	}
}

// The mixin configs are listed in neoforge.mods.toml ([[mixins]]), the test
// mod's in its own.

// Vanilla's game test server makes a fresh flat test world for each run
// (gametestserver/); only the last run's report is cleared first.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
	doFirst {
		delete "${rootBuild}/gametest-neoforge/junit.xml"
	}
}

tasks.named('check') {
	dependsOn 'runGameTestServer'
}

// The game tests as a jar for production NeoForge servers (Mojang names, as
// NeoForge runs), to run them against released loader versions: start the
// server through net.neoforged.fml.startup.GameTestServer with
// -Dneoforge.gameTestServer=true.
// Never published; it is built outside build/libs.
tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	archiveClassifier = 'gametest'
	destinationDirectory = layout.buildDirectory.dir('gametestlibs')
}

processResources {
	def props = [version: project.version, minecraft_version: minecraft_version,
			next_minecraft_version: next_minecraft_version, neoforge_minecraft_min: neoforge_minecraft_min,
			loader_version_range: neoforge_loader_version_range, neoforge_version_range: neoforge_version_range]
	inputs.properties props
	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand props
	}
}
