org.gradle.jvmargs=-Xmx3G

# Minecraft
minecraft_version=1.21.4
# The first version this branch does not run on (the upper bound of the loaders' version ranges).
next_minecraft_version=1.21.5
# Every Minecraft version the Fabric jar claims (fabric.mod.json): each one passes
# the game tests on a production server of that version.
minecraft_versions=1.21.4
# Vanilla for common, compiled with ModDevGradle's NeoForm mode.
neoform_version=1.21.4-20241203.161809
parchment_minecraft=1.21.4
parchment_mappings=2025.03.23

# Fabric
loader_version=0.19.5
# The oldest Fabric Loader the Fabric jar asks for (fabric.mod.json): the first that ships
# MixinExtras 0.5.5; older ones crash on the mod's redirects, and the jar does not bundle it.
fabric_loader_min=0.19.5
fabric_version=0.119.4+1.21.4
# The oldest Fabric API the Fabric jar asks for (fabric.mod.json): the final 1.21.4
# build, which the jar is built against.
fabric_api_min=0.119.4

# Mod
mod_version=2.2.0
maven_group=net.calibermc
archives_base_name=secret-blocks

# NeoForge (its own API from 1.20.2: packages net.neoforged.*, Mojang names at run time)
neoforge_version=21.4.161
# The FML major versions the NeoForge jar loads on (neoforge.mods.toml).
neoforge_loader_version_range=[2,)
# The oldest NeoForge the jar asks for: the first stable 21.4 build (21.4 runs 1.21.4).
neoforge_version_range=[21.4.121,)
# The oldest Minecraft the NeoForge jar claims (neoforge.mods.toml).
neoforge_minecraft_min=1.21.4

# Forge (its own jar from 1.20.2; Mojang names at run time from 1.20.6)
forge_version=54.1.22
# The FML major versions and Forge versions the Forge jar loads on (mods.toml).
forge_loader_version_range=[54,)
forge_version_range=[54.1.0,)
# ForgeGradle merges each source set's classes and resources for its runs.
net.minecraftforge.gradle.merge-source-sets=true
