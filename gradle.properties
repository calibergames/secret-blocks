org.gradle.jvmargs=-Xmx3G

# Minecraft
minecraft_version=26.1.2
# The first version this branch does not run on (the upper bound of the loaders' version ranges).
next_minecraft_version=26.2
# Every Minecraft version the Fabric jar claims (fabric.mod.json): each one passes
# the game tests on a production server of that version.
minecraft_versions=26.1.2
# Vanilla for common, compiled with ModDevGradle's NeoForm mode.
neoform_version=26.1.2-1

# Fabric
loader_version=0.20.1
# The oldest Fabric Loader the Fabric jar asks for (fabric.mod.json): the oldest tested.
fabric_loader_min=0.20.1
fabric_version=0.155.3+26.1.2
# The oldest Fabric API the Fabric jar asks for (fabric.mod.json): the build the jar
# is built against.
fabric_api_min=0.155.3

# Mod
mod_version=2.1.2
maven_group=net.calibermc
archives_base_name=secret-blocks

# NeoForge (its own API from 1.20.2: packages net.neoforged.*, Mojang names at run time)
neoforge_version=26.1.2.126
# The FML major versions the NeoForge jar loads on (neoforge.mods.toml).
neoforge_loader_version_range=[2,)
# The oldest NeoForge the jar asks for: the first stable 26.1.2 build.
neoforge_version_range=[26.1.2.71,)
# The oldest Minecraft the NeoForge jar claims (neoforge.mods.toml).
neoforge_minecraft_min=26.1.2

# Forge (its own jar from 1.20.2; Mojang names at run time from 1.20.6)
forge_version=64.1.5
# The FML major versions and Forge versions the Forge jar loads on (mods.toml).
forge_loader_version_range=[64,)
forge_version_range=[64.1.5,)
# ForgeGradle merges each source set's classes and resources for its runs.
net.minecraftforge.gradle.merge-source-sets=true
