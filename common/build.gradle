// The loader-neutral mod, compiled against vanilla Minecraft (Mojang's own
// names and parameter names: Minecraft ships unobfuscated from 26.1). Its sources and resources are built into
// each loader's jar.
plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

neoForge {
	neoFormVersion = neoform_version
	accessTransformers = files('accesstransformer.cfg')
}

dependencies {
	compileOnly 'org.spongepowered:mixin:0.8.5'
	compileOnly 'org.jetbrains:annotations:24.0.1'
	// ASM for compiling against Mixin's API (compile only: each loader brings its own).
	compileOnly 'org.ow2.asm:asm:9.3'
	compileOnly 'org.ow2.asm:asm-tree:9.3'
	testImplementation 'org.ow2.asm:asm-tree:9.6'
}

// The game tests, shared by every loader: compiled here against vanilla to
// check them, and built into each loader's test mod.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	}
}

configurations {
	commonGametestJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonGametestResources {
		canBeResolved = false
		canBeConsumed = true
	}
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonGametestJava sourceSets.gametest.java.sourceDirectories.singleFile
	commonGametestResources sourceSets.gametest.resources.sourceDirectories.singleFile
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// The shared tests run in each loader's build; here they are compiled against vanilla.
tasks.named('check') {
	dependsOn 'gametestClasses'
}
