# Publishes a release to Modrinth and CurseForge, and attaches the jars to the
# GitHub release, when a GitHub release is published: the Fabric jar (Fabric and
# Quilt, every Minecraft version in minecraft_versions) and the NeoForge jar
# (NeoForge and Forge, minecraft_version), each as its own version. The jars are
# attached with the GitHub CLI, so the release's title and notes stay as written.
#
# The release tag must match the build's version: <minecraft_version>-<mod_version>
# from gradle.properties (for example 1.20.1-2.1.0). The release notes become
# the changelog on both sites.
#
# A GitHub pre-release is uploaded as a beta.
#
# The job runs in the "release" environment, which holds the upload tokens and
# waits for a maintainer's approval before it starts. Actions are pinned to
# full commit SHAs.
#
# If one site takes an upload and the other fails, a re-run is refused by the
# site that already has the version: upload that jar to the other site by hand.

name: release
on:
  release:
    types: [published]

permissions:
  contents: write # attach the jars to the GitHub release

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: setup jdk 17, 21 and 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: read the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          minecraft=$(sed -n 's/^minecraft_version *= *//p' gradle.properties | tr -d '[:space:]')
          mod=$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '[:space:]')
          version="$minecraft-$mod"
          if [ "$TAG" != "$version" ]; then
            echo "The release tag '$TAG' does not match the build version '$version'." >&2
            exit 1
          fi
          versions=$(sed -n 's/^minecraft_versions *= *//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$minecraft" ] || [ -z "$versions" ]; then
            echo "gradle.properties needs minecraft_version and minecraft_versions." >&2
            exit 1
          fi
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          # Every version the Fabric jar claims, one per line (mc-publish lists).
          {
            echo "minecraft_versions<<VERSIONS"
            echo "$versions" | tr ',' '\n'
            echo "VERSIONS"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: build
        shell: bash
        # Gradle runs on Java 25; the mod builds and is tested on Java 17;
        # ModDevGradle runs its Minecraft setup tools on Java 21.
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
      - name: publish the Fabric and Quilt jar
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: wChSsP4D
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 844758
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/secret-blocks-fabric-${{ steps.version.outputs.version }}.jar
          name: Secret Blocks ${{ steps.version.outputs.version }} (Fabric, Quilt)
          version: ${{ steps.version.outputs.version }}+fabric
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: |
            fabric
            quilt
          game-versions: ${{ steps.version.outputs.minecraft_versions }}
          dependencies: fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          java: 17
      - name: publish the NeoForge and Forge jar
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: wChSsP4D
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 844758
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/secret-blocks-neoforge-${{ steps.version.outputs.version }}.jar
          name: Secret Blocks ${{ steps.version.outputs.version }} (NeoForge, Forge)
          version: ${{ steps.version.outputs.version }}+neoforge
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: |
            neoforge
            forge
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: 17
      - name: attach the jars to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$TAG" --clobber \
            "fabric/build/libs/secret-blocks-fabric-$VERSION.jar" \
            "neoforge/build/libs/secret-blocks-neoforge-$VERSION.jar"
