# Builds the project and runs the tests (JUnit and the game tests) for every
# push and pull request, on Linux and Windows. Gradle runs on Java 25 (the
# Loom version needs it); the mod compiles and its tests run on the Java 17
# toolchain; ModDevGradle runs its Minecraft setup tools on Java 21. Actions
# are pinned to full commit SHAs.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: setup jdk 17, 21 and 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: build
        shell: bash
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
