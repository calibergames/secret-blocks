# Builds the project and runs the tests (JUnit and the game tests) for every
# push and pull request, on Linux only: the jars are the same on every OS, so
# one platform covers them. Gradle runs on Java 25 (the
# Loom version needs it), and the mod compiles and its tests run on Java 25
# too, on Fabric, NeoForge and Forge. Actions are pinned to full commit
# SHAs.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: setup jdk 21 and 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: list java toolchains
        shell: bash
        run: ./gradlew javaToolchains -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
      - name: build
        shell: bash
        run: ./gradlew build -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
      - name: list failed game tests
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          for loader, report in (('fabric', 'build/gametest/junit.xml'), ('neoforge', 'build/gametest-neoforge/junit.xml'),
                                 ('forge', 'build/gametest-forge/junit.xml')):
              if not os.path.exists(report):
                  print(loader, ': no game test report')
                  continue
              for case in ET.parse(report).getroot().iter('testcase'):
                  for result in case:
                      if result.tag in ('failure', 'error'):
                          print(loader, case.get('name'), '::', (result.get('message') or result.text or '').strip())
          PY
