plugins {
	id 'fabric-loom' version '1.18.2'
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}
version = project.minecraft_version + "-" + project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "ParchmentMC"
		url = "https://maven.parchmentmc.org"
		content {
			includeGroup "org.parchmentmc.data"
		}
	}
	maven {
		name = "CurseMaven"
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

// Game tests live in their own source set and mod (secretblocks-gametest), so
// nothing test-only ships in the release jar. `./gradlew runGametest` starts a
// headless server, runs every test and writes build/gametest/junit.xml;
// `check` (and therefore `build`) depends on it.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

def buildDirPath = layout.buildDirectory.get().asFile.path

loom {
	runs {
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${buildDirPath}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		// A client with the development-only command-file test driver (src/gametest,
		// DevClientDriver): test scripts act as the player through the real client code.
		devClient {
			client()
			name "Dev Client (driver)"
			vmArg "-Dsecretblocks.driver=${buildDirPath}/devclient"
			source sourceSets.gametest
		}
	}
}

// The game tests start from a fresh world on every run. The world would otherwise be kept
// in build/gametest, and items or item frames left by a failed test would reach the next run.
tasks.matching { it.name == "runGametest" }.configureEach {
	doFirst {
		delete "${buildDirPath}/gametest/world"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_mappings}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.9.1"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.1"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// Gradle itself may run on a newer Java; the mod is compiled, tested and run on Java 17.
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

// Plain JUnit tests (src/test) for logic with no Minecraft dependency.
test {
	useJUnitPlatform()
}

tasks.named("check") {
	dependsOn "runGametest"
}

jar {
	// The licence, and the notice naming what the mod contains from other projects.
	def name = base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${name}" }
	}
	from("NOTICE") {
		rename { "${it}_${name}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
